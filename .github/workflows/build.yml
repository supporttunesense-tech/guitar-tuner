name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты и сборка
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk GuitarTuner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner
          path: GuitarTuner.apk

      - name: Выложить в релиз (скачивание прямо с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тюнер, сборка ${{ github.run_number }}
          files: GuitarTuner.apk
          make_latest: true
